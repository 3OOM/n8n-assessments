<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background:#0f111a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="modalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Dimmed Background -->
  <rect width="1200" height="650" fill="#0c0e17" opacity="0.9" />

  <!-- Node Edit Modal -->
  <g filter="url(#modalShadow)">
    <rect x="180" y="50" width="840" height="550" rx="16" fill="#181b29" stroke="#2b314d" stroke-width="1.5" />

    <!-- Modal Header -->
    <rect x="180" y="50" width="840" height="60" rx="16" fill="#1f2336" />
    <rect x="180" y="94" width="840" height="16" fill="#1f2336" />
    <circle cx="215" cy="80" r="12" fill="#ff6d5a" />
    <text x="238" y="86" fill="#ffffff" font-size="16" font-weight="700">Edit Fields (Set)</text>
    <rect x="360" y="70" width="70" height="22" rx="4" fill="#2d3557" />
    <text x="372" y="85" fill="#a5b4fc" font-size="11" font-weight="600">ACTION</text>

    <!-- Close button -->
    <circle cx="985" cy="80" r="14" fill="#272d47" />
    <text x="979" y="85" fill="#94a3b8" font-size="16">✕</text>

    <!-- Modal Tabs -->
    <rect x="220" y="130" width="110" height="32" rx="6" fill="#ff6d5a" />
    <text x="245" y="151" fill="#ffffff" font-size="13" font-weight="600">Parameters</text>
    <rect x="340" y="130" width="90" height="32" rx="6" fill="#1e2238" stroke="#2c3350" stroke-width="1" />
    <text x="360" y="151" fill="#94a3b8" font-size="13">Settings</text>

    <!-- Form Section -->
    <text x="220" y="200" fill="#cbd5e1" font-size="14" font-weight="600">Fields to Set</text>
    <text x="220" y="222" fill="#64748b" font-size="12">Configure custom attributes to be generated in output JSON</text>

    <!-- Field Card -->
    <rect x="220" y="240" width="760" height="190" rx="12" fill="#131622" stroke="#2e3553" stroke-width="1.5" />

    <!-- Field Type Selector -->
    <text x="250" y="275" fill="#94a3b8" font-size="12" font-weight="600">Type</text>
    <rect x="250" y="285" width="140" height="40" rx="8" fill="#1e2338" stroke="#3b446a" stroke-width="1" />
    <text x="268" y="310" fill="#38bdf8" font-size="14" font-weight="600">String (text)</text>

    <!-- Field Name Input -->
    <text x="410" y="275" fill="#94a3b8" font-size="12" font-weight="600">Name</text>
    <rect x="410" y="285" width="220" height="40" rx="8" fill="#1e2338" stroke="#3b446a" stroke-width="1" />
    <text x="425" y="310" fill="#22c55e" font-size="14" font-weight="600">greeting</text>

    <!-- Field Value Input -->
    <text x="650" y="275" fill="#94a3b8" font-size="12" font-weight="600">Value</text>
    <rect x="650" y="285" width="300" height="40" rx="8" fill="#1e2338" stroke="#ff6d5a" stroke-width="1.5" />
    <text x="665" y="310" fill="#ffffff" font-size="14" font-weight="600">Hello, n8n!</text>

    <!-- Description row inside card -->
    <rect x="250" y="345" width="700" height="60" rx="8" fill="#181d2f" stroke="#252c46" stroke-width="1" />
    <text x="270" y="370" fill="#94a3b8" font-size="12">Target Payload Preview:</text>
    <text x="270" y="390" fill="#38bdf8" font-family="monospace" font-size="13">"greeting": "Hello, n8n!"</text>

    <!-- Add Value Button -->
    <rect x="220" y="450" width="150" height="38" rx="8" fill="#20263f" stroke="#394266" stroke-width="1" />
    <text x="245" y="474" fill="#cbd5e1" font-size="13" font-weight="600">+ Add Value</text>

    <!-- Execute Step Button -->
    <rect x="800" y="525" width="180" height="45" rx="10" fill="#22c55e" />
    <text x="830" y="553" fill="#ffffff" font-size="14" font-weight="700">Test step ▶</text>
  </g>
</svg>
